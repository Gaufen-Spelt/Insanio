    <!-- HEADER -->

      <div class="header-title">
        <h1 id="game-title">Insanio: The Beginnings</h1>
        <h2 id="game-author">Gaufen Spelt</h2>
      </div>
      <div id="header-links">

        <a onclick="dendryUI.showSaveSlots();" href="#">Save/Load</a>
        <a onclick="window.showOptions();" href="#">Options</a>
      </div>
    </header>

    <!-- SIDEBAR -->
    <aside id="stats_sidebar">
      <div class="tab_container">
        <button class="tab_button active" id="main_tab"
                onclick="window.changeTab('status', 'main_tab');">Main</button>
        <button class="tab_button" id="politics_tab"
                onclick="window.changeTab('status.politics', 'politics_tab');">Politics</button>
        <button class="tab_button" id="paramilitary_tab"
                onclick="window.changeTab('status.paramilitaries', 'paramilitary_tab');">Defense</button>
        <button class="tab_button" id="poll_tab"
                onclick="window.changeTab('status.polls', 'poll_tab');">Polls</button>
      </div>
      <div id="qualities"></div>
    </aside>

    <!-- MAIN CONTENT -->
    <main id="content"></main>

    <!-- NOTEBOOK PANEL -->
    <div id="notebook">
      <!-- Clickable strip — always visible -->
      <div id="notebook-tab" onclick="toggleNotebook()" title="Toggle notebook">
        <span class="tab-icon">📓</span>
        Notes
      </div>
      <!-- Expandable body -->
      <div id="notebook-body">
        <div id="notebook-header">
          <span>Notebook</span>
          <button id="notebook-clear" onclick="clearNotebook()">Clear</button>
        </div>
        <textarea
          id="notebook-textarea"
          placeholder="Jot down anything — clues, theories, names…"
          spellcheck="false"
        ></textarea>
        <div id="notebook-footer">Saved locally in your browser.</div>
      </div>
    </div>

    <footer></footer>

  </div><!-- #page -->

  <!--
    NOTEBOOK SCRIPT — place this after your game scripts so it runs last.
    If game.js already defines window.enableLightMode / enableDarkMode,
    remove those two lines from here to avoid conflicts.
  -->
  <script>
    const NOTEBOOK_KEY = 'insanio_notebook';
    const notebookPage = document.getElementById('page');
    const notebookArea = document.getElementById('notebook-textarea');

    function toggleNotebook() {
      notebookPage.classList.toggle('notebook-open');
      if (notebookPage.classList.contains('notebook-open')) {
        setTimeout(() => notebookArea.focus(), 320);
      }
    }

    function clearNotebook() {
      if (confirm('Clear all notes?')) {
        notebookArea.value = '';
        localStorage.setItem(NOTEBOOK_KEY, '');
      }
    }

    // Persist notes
    try { notebookArea.value = localStorage.getItem(NOTEBOOK_KEY) || ''; } catch(e) {}
    notebookArea.addEventListener('input', () => {
      try { localStorage.setItem(NOTEBOOK_KEY, notebookArea.value); } catch(e) {}
    });

  </script>
